<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Salón de Uñas</title>
    <!-- Estilos con Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-section" class="flex items-center justify-center min-h-screen bg-pink-50">
        <div class="bg-white p-8 rounded-xl shadow-md w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-pink-600">Acceso Administrador</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Correo electrónico</label>
                    <input type="email" id="login-email" required class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-pink-500 focus:border-pink-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                    <input type="password" id="login-password" required class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-pink-500 focus:border-pink-500">
                </div>
                <button type="submit" class="w-full bg-pink-600 text-white p-2 rounded-md hover:bg-pink-700 font-medium">Ingresar</button>
                <p id="login-error" class="text-red-500 text-sm text-center mt-2"></p>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-section" class="hidden">
        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold text-gray-800">💅 Panel de Turnos - Made by Malu</h1>
                <button id="logout-btn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 text-sm font-medium">Cerrar Sesión</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Formulario Turno -->
            <div class="bg-white p-6 rounded-xl shadow-sm h-fit">
                <h2 class="text-lg font-semibold mb-4 text-gray-800">Agendar Nuevo Turno</h2>
                <form id="turno-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nombre de la Clienta</label>
                        <input type="text" id="cliente-nombre" required class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Servicio</label>
                        <select id="servicio" class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                            <option value="Esemipermanente">Esmaltado Semipermanente</option>
                            <option value="Kapping">Kapping Gel</option>
                            <option value="Esculpidas">Uñas Esculpidas</option>
                            <option value="Service">Service / Retoque</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Fecha y Hora</label>
                        <input type="datetime-local" id="fecha-hora" required class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                    </div>
                    <button type="submit" class="w-full bg-pink-600 text-white p-2 rounded-md hover:bg-pink-700 font-medium">Guardar Turno</button>
                </form>
            </div>

            <!-- Listado de Turnos -->
            <div class="bg-white p-6 rounded-xl shadow-sm md:col-span-2">
                <h2 class="text-lg font-semibold mb-4 text-gray-800">Próximos Turnos</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead>
                            <tr>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Clienta</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Servicio</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Fecha y Hora</th>
                                <th class="px-4 py-2 text-right text-xs font-medium text-gray-500 uppercase">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="turnos-tabla" class="divide-y divide-gray-200 text-sm">
                            <!-- Se cargan en tiempo real -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- SCRIPTS DE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
           apiKey: "AIzaSyBHtfAQOCCAGudGAJiEWrEmy8Uq9b0U4qc",
  authDomain: "madebymalu.firebaseapp.com",
  projectId: "madebymalu",
  storageBucket: "madebymalu.firebasestorage.app",
  messagingSenderId: "622803417119",
  appId: "1:622803417119:web:a2dddb3b8acd771b80bd2a",
  measurementId: "G-FN0QSYRJLV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const turnoForm = document.getElementById('turno-form');
        const turnosTabla = document.getElementById('turnos-tabla');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                cargarTurnosEnTiempoReal();
            } else {
                loginSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            loginError.textContent = '';

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                loginError.textContent = "Error: Verifique su correo o contraseña.";
                console.error(error);
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
        });

        turnoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('cliente-nombre').value;
            const servicio = document.getElementById('servicio').value;
            const fechaHora = document.getElementById('fecha-hora').value;

            try {
                await addDoc(collection(db, "turnos"), {
                    cliente: nombre,
                    servicio: servicio,
                    fechaHora: fechaHora,
                    creado: new Date()
                });
                turnoForm.reset();
            } catch (error) {
                console.error("Error al guardar turno: ", error);
                alert("Hubo un error al guardar el turno.");
            }
        });

        function cargarTurnosEnTiempoReal() {
            const q = query(collection(db, "turnos"), orderBy("fechaHora", "asc"));
            onSnapshot(q, (snapshot) => {
                turnosTabla.innerHTML = "";
                if (snapshot.empty) {
                    turnosTabla.innerHTML = `<tr><td colspan="4" class="px-4 py-4 text-center text-gray-500">No hay turnos agendados.</td></tr>`;
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const turno = docSnap.data();
                    const id = docSnap.id;
                    
                    const fechaFormateada = new Date(turno.fechaHora).toLocaleString('es-ES', {
                        dateStyle: 'medium',
                        timeStyle: 'short'
                    });

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-4 py-3 font-medium text-gray-900">${turno.cliente}</td>
                        <td class="px-4 py-3 text-gray-600">${turno.servicio}</td>
                        <td class="px-4 py-3 text-gray-600">${fechaFormateada}</td>
                        <td class="px-4 py-3 text-right">
                            <button onclick="window.eliminarTurno('${id}')" class="text-red-600 hover:text-red-900 font-medium text-xs bg-red-50 px-2 py-1 rounded">Eliminar</button>
                        </td>
                    `;
                    turnosTabla.appendChild(tr);
                });
            });
        }

        window.eliminarTurno = async function(id) {
            if (confirm("¿Estás seguro de eliminar este turno?")) {
                try {
                    await deleteDoc(doc(db, "turnos", id));
                } catch (error) {
                    console.error("Error al eliminar: ", error);
                }
            }
        }
    </script>
</body>
</html>
